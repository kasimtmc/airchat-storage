# cargo-deny: what the Rust dependencies may be. Run `cargo deny check` here.

[advisories]
# RustSec advisories, unmaintained crates included, fail the check unless listed here with a reason.
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2, unmaintained: a build-time macro of hax-lib, libcrux's verification annotations; none of it ships. Goes when libcrux moves off it." },
]

[licenses]
# Everything that ships must be compatible with GPL-3.0-or-later.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
exceptions = [
    # SQLCipher's sources: SQLite's public-domain blessing, and libtomcrypt (WTFPL), which ships in
    # the crate but is not built here (SQLCipher uses the vendored OpenSSL). Both GPL-compatible.
    { allow = ["blessing", "WTFPL"], crate = "sqlcipher-src" },
]

[bans]
# Two versions of one crate are worth knowing about, not failing on.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version; none of these crates is published.
allow-wildcard-paths = true

[sources]
# crates.io, and the protocol from its own repository; nothing else.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/kasimtmc/airchat-protocol"]
